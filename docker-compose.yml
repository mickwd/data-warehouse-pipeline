name: dwh-pipeline

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: dwh-pipeline-app:latest
  env_file: .env
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Almacenamiento
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports: ["1433:1433"]
    volumes: [sqlserver-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    volumes:
      - ./sql/sqlserver:/sql:ro
      - ./docker/sqlserver-init.sh:/init.sh:ro
    entrypoint: ["bash", "/init.sh"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Mensajería
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Orígenes simulados
  # ---------------------------------------------------------------------------
  products-api:
    <<: *app
    command: ["uvicorn", "mock_sources.products_api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]

  oltp-simulator:
    <<: *app
    command: ["python", "-m", "mock_sources.oltp_simulator", "--seed-customers", "300", "--orders-per-minute", "120"]
    depends_on:
      postgres: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Streaming
  # ---------------------------------------------------------------------------
  event-producer:
    <<: *app
    command: ["python", "-m", "streaming.producer"]
    environment:
      # environment pisa a env_file, permite `STREAM_BROKER=rabbitmq docker compose up`
      STREAM_BROKER: ${STREAM_BROKER:-kafka}
    depends_on:
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  stream-processor:
    <<: *app
    command: ["python", "-m", "streaming.pipeline"]
    environment:
      # environment pisa a env_file, permite `STREAM_BROKER=rabbitmq docker compose up`
      STREAM_BROKER: ${STREAM_BROKER:-kafka}
    depends_on:
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  dashboard:
    <<: *app
    command: ["uvicorn", "dashboard.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Orquestación batch
  # ---------------------------------------------------------------------------
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: dwh-pipeline-airflow:latest
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      PIPELINE_HOME: /opt/pipeline
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password $${AIRFLOW_ADMIN_PASSWORD}
                 --firstname Admin --lastname DWH --role Admin --email admin@example.com || true) &&
               exec airflow standalone"
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./common:/opt/pipeline/common:ro
      - ./batch:/opt/pipeline/batch:ro
      - ./dbt:/opt/pipeline/dbt
    depends_on:
      postgres: { condition: service_healthy }
      sqlserver-init: { condition: service_completed_successfully }
      products-api: { condition: service_started }

volumes:
  sqlserver-data:
  postgres-data:
  kafka-data:
